name: Update data & deploy

on:
  schedule:
    - cron: '17 2 * * *' # daily, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch latest data (Wikidata, Wikipedia, World Bank)
        if: github.event_name != 'push'
        env:
          CONTACT: https://github.com/${{ github.repository }}
        run: node scripts/fetch-data.mjs
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
