  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" /><path d="M2 16h28M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28" /></svg>

      <nav class="nav" aria-label="Main">
